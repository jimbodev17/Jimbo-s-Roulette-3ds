name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install 3DS libraries
        run: dkp-pacman -Syu --noconfirm 3ds-dev
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: jimbos_roulette
          path: jimbos_roulette.3dsx
